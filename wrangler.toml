name = "sentinel-saas"
main = "workers/main.ts"
# >= 2024-09-23 so esbuild resolves Node built-ins (util, crypto, net, tls…) for mysql2/postgres deps
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

vars = { ENVIRONMENT = "development", LOG_LEVEL = "debug", WORKER_URL = "http://localhost:8787" }

[[kv_namespaces]]
binding = "RULE_CACHE"
id = "f66be187e4f54bc2a5325c20c29490b2"
preview_id = "c9a95b19ba034127ad9a667249442778"

[[r2_buckets]]
binding = "DLQ_BUCKET"
bucket_name = "sentinel-dlq"
preview_bucket_name = "sentinel-dlq-preview"

[env.production]
name = "sentinel-saas-prod"
vars = { ENVIRONMENT = "production", LOG_LEVEL = "info", WORKER_URL = "https://sentinel-saas-prod.yourworker.workers.dev" }

# Secrets (set via `wrangler secret put <NAME>`):
# SUPABASE_URL
# SUPABASE_SERVICE_KEY
# SENTINEL_DESTINATION_SECRET_KEY — base64-encoded 32-byte AES key (openssl rand -base64 32) for encrypting destination secrets in DB
# ANTHROPIC_API_KEY
# UPSTASH_REDIS_REST_URL
# UPSTASH_REDIS_REST_TOKEN
# RESEND_API_KEY
# SENTINEL_WEBHOOK_SECRET

# Optional: single shared Postgres/MySQL pool (Cloudflare Hyperdrive). Uncomment and set id from dashboard.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "your-hyperdrive-config-id"

[[rules]]
type = "ESModule"
globs = ["**/*.ts"]
