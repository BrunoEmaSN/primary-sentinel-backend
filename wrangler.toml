name = "sentinel-saas"
main = "workers/main.ts"
compatibility_date = "2024-06-01"
compatibility_flags = ["nodejs_compat"]

[env.development]
name = "sentinel-saas-dev"
vars = { ENVIRONMENT = "development", LOG_LEVEL = "debug", WORKER_URL = "http://localhost:8787" }

[env.production]
name = "sentinel-saas-prod"
vars = { ENVIRONMENT = "production", LOG_LEVEL = "info", WORKER_URL = "https://sentinel-saas-prod.yourworker.workers.dev" }

# KV Namespace for transformation rule cache + rate limiting
[[kv_namespaces]]
binding = "RULE_CACHE"
id = "f66be187e4f54bc2a5325c20c29490b2"
preview_id = "c9a95b19ba034127ad9a667249442778"

# R2 Bucket for Dead Letter Queue storage
[[r2_buckets]]
binding = "DLQ_BUCKET"
bucket_name = "sentinel-dlq"
preview_bucket_name = "sentinel-dlq-preview"

# Secrets (set via `wrangler secret put <n>`)
# SUPABASE_URL
# SUPABASE_SERVICE_KEY
# ANTHROPIC_API_KEY
# UPSTASH_REDIS_REST_URL
# UPSTASH_REDIS_REST_TOKEN
# QSTASH_TOKEN
# QSTASH_CURRENT_SIGNING_KEY
# QSTASH_NEXT_SIGNING_KEY
# RESEND_API_KEY
# SENTINEL_WEBHOOK_SECRET

[build]
command = "npm run build"

[limits]
cpu_ms = 50

[[rules]]
type = "ESModule"
globs = ["**/*.ts"]
